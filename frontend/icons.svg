    </symbol>

    <!-- Send points along the reading direction: mirrored in RTL. -->
    <symbol id="ic-send" viewBox="0 0 24 24">
      <path d="M4.5 12h9M4.25 5.25l15.5 6.75-15.5 6.75 2.6-6.75z" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"/>
