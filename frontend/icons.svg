      <g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round">
        <path d="M7.5 10.5v9h-3v-9zM7.5 10.5l3.6-6.25a1.9 1.9 0 0 1 3.4 1.55L13.6 10h4.95a1.9 1.9 0 0 1 1.85 2.3l-1.4 5.7a2 2 0 0 1-1.95 1.5H7.5"/>
