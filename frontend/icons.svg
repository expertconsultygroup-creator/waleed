    <symbol id="ic-sidebar" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round">
        <rect x="3.75" y="4.75" width="16.5" height="14.5" rx="2.5"/><path d="M9.5 4.75v14.5M15.5 10l-2 2 2 2"/>
      </g>
    </symbol>

    <symbol id="ic-sun" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2.75v2M12 19.25v2M2.75 12h2M19.25 12h2M5.45 5.45l1.4 1.4M17.15 17.15l1.4 1.4M5.45 18.55l1.4-1.4M17.15 6.85l1.4-1.4"/>
