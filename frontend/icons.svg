    </symbol>

    <symbol id="ic-thumb-down" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round">
        <path d="M16.5 13.5v-9h3v9zM16.5 13.5l-3.6 6.25a1.9 1.9 0 0 1-3.4-1.55L10.4 14H5.45a1.9 1.9 0 0 1-1.85-2.3L5 6a2 2 0 0 1 1.95-1.5h9.55"/>
      </g>
    </symbol>

    <symbol id="ic-pencil" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round">
        <path d="M4.5 19.5l1-4.25L15.75 5a1.9 1.9 0 0 1 2.7 0l.55.55a1.9 1.9 0 0 1 0 2.7L8.75 18.5zM13.75 7l3.25 3.25"/>
      </g>
    </symbol>

