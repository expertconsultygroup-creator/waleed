    <symbol id="ic-spark-small" viewBox="0 0 24 24">
      <path d="M12 3.5L14.2 6.68L18 6L17.32 9.8L20.5 12L17.32 14.2L18 18L14.2 17.32L12 20.5L9.8 17.32L6 18L6.68 14.2L3.5 12L6.68 9.8L6 6L9.8 6.68Z"
            fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    </symbol>

    <symbol id="ic-markdown" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2.75" y="5.75" width="18.5" height="12.5" rx="2.25"/>
        <path d="M6.25 15V9l2.5 3 2.5-3v6M16.5 9v6M14.25 12.75 16.5 15l2.25-2.25"/>
      </g>
    </symbol>

    <symbol id="ic-speak" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4.5 9.5h3l4.5-4v13l-4.5-4h-3zM15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>
      </g>
    </symbol>

    <symbol id="ic-anchor" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 14a3.5 3.5 0 0 0 5 0l3.5-3.5a3.5 3.5 0 0 0-5-5L12.75 6.25M14 10a3.5 3.5 0 0 0-5 0l-3.5 3.5a3.5 3.5 0 0 0 5 5l.75-.75"/>
      </g>
    </symbol>

    <symbol id="ic-external" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13.5 5.5H18.5V10.5M18.5 5.5 11 13M16 14v3.5a1.5 1.5 0 0 1-1.5 1.5h-8A1.5 1.5 0 0 1 5 17.5v-8A1.5 1.5 0 0 1 6.5 8H10"/>
      </g>
    </symbol>

    <symbol id="ic-empty" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
        <path d="M4 13.5 6.5 6h11l2.5 7.5v4.75A1.75 1.75 0 0 1 18.25 20H5.75A1.75 1.75 0 0 1 4 18.25z"/><path d="M4 13.5h4.5l1 2h5l1-2H20"/>
