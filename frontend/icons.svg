    </symbol>

    <!-- A crescent: the moon a reader in this tradition recognises. -->
    <symbol id="ic-moon" viewBox="0 0 24 24">
      <path d="M19.5 14.6A7.75 7.75 0 0 1 9.4 4.5a7.75 7.75 0 1 0 10.1 10.1z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/>
    </symbol>

    <symbol id="ic-settings" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M12 2.75l1.6 2.4 2.85-.55.55 2.85 2.4 1.6-1.25 2.95 1.25 2.95-2.4 1.6-.55 2.85-2.85-.55-1.6 2.4-1.6-2.4-2.85.55-.55-2.85-2.4-1.6L5.85 12 4.6 9.05 7 7.45l.55-2.85 2.85.55z"/>
      </g>
    </symbol>

    <symbol id="ic-download" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 4.5v10.5M7.5 10.75 12 15.25l4.5-4.5M5 19.5h14"/>
      </g>
    </symbol>

    <symbol id="ic-chat" viewBox="0 0 24 24">
      <path d="M5.75 5h12.5A1.75 1.75 0 0 1 20 6.75v8.5A1.75 1.75 0 0 1 18.25 17H11l-4.5 3.25V17h-.75A1.75 1.75 0 0 1 4 15.25v-8.5A1.75 1.75 0 0 1 5.75 5z"
