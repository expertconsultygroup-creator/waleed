    </symbol>

    <symbol id="ic-dashboard" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round">
        <rect x="4" y="4" width="7" height="9" rx="1.5"/><rect x="13" y="4" width="7" height="5" rx="1.5"/>
        <rect x="13" y="11" width="7" height="9" rx="1.5"/><rect x="4" y="15" width="7" height="5" rx="1.5"/>
      </g>
    </symbol>

    <symbol id="ic-globe" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <circle cx="12" cy="12" r="8.25"/>
        <path d="M3.75 12h16.5M12 3.75c2.3 2.3 3.4 5 3.4 8.25s-1.1 5.95-3.4 8.25M12 3.75C9.7 6.05 8.6 8.75 8.6 12s1.1 5.95 3.4 8.25"/>
      </g>
    </symbol>

    <symbol id="ic-warn" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.3 4.6a2 2 0 0 1 3.4 0l7 12.1a2 2 0 0 1-1.7 3H5a2 2 0 0 1-1.7-3z"/><path d="M12 9.5v4M12 16.75v.25"/>
      </g>
    </symbol>

    <symbol id="ic-info" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round">
        <circle cx="12" cy="12" r="8.25"/><path d="M12 11v5.25M12 7.75V8"/>
      </g>
    </symbol>

