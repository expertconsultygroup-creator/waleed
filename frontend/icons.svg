<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <!-- App mark: the khatam (Rub el Hizb) inside a circle. Two squares on one
         circle, a quarter-turn apart: the circle divided eight ways, joined
         every second point ({8/2}). The centre ring is the gold accent. -->
    <symbol id="px-mark" viewBox="0 0 32 32">
      <circle cx="16" cy="16" r="15" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <path d="M16 4.5L27.5 16L16 27.5L4.5 16L16 4.5ZM24.132 7.868L24.132 24.132L7.868 24.132L7.868 7.868L24.132 7.868Z"
            fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <circle cx="16" cy="16" r="3.2" style="fill: var(--ornament, currentColor)"/>
    </symbol>

    <!-- Assistant avatar: the same eight-pointed outline, filled. -->
    <symbol id="px-spark" viewBox="0 0 24 24">
      <path d="M12 2L14.929 4.929L19.071 4.929L19.071 9.071L22 12L19.071 14.929L19.071 19.071L14.929 19.071L12 22L9.071 19.071L4.929 19.071L4.929 14.929L2 12L4.929 9.071L4.929 4.929L9.071 4.929Z"
            fill="currentColor"/>
      <circle cx="12" cy="12" r="3" style="fill: var(--surface, #fff)"/>
    </symbol>

    <symbol id="px-user" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8.5" r="3.75"/>
        <path d="M4.75 20c.9-3.6 3.8-5.5 7.25-5.5s6.35 1.9 7.25 5.5"/>
      </g>
    </symbol>

    <!-- Loader: the regular octagram {8/3}, traced stroke by stroke.
         pathLength normalises the dash so the CSS animation is size-free. -->
    <symbol id="ic-octagram" viewBox="0 0 24 24">
      <path pathLength="100" d="M12 2L13.585 8.173L19.071 4.929L15.827 10.415L22 12L15.827 13.585L19.071 19.071L13.585 15.827L12 22L10.415 15.827L4.929 19.071L8.173 13.585L2 12L8.173 10.415L4.929 4.929L10.415 8.173Z"
            fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
    </symbol>

    <symbol id="ic-plus" viewBox="0 0 24 24">
      <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>

    <symbol id="ic-search" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
        <circle cx="10.5" cy="10.5" r="6.25"/><path d="M15.25 15.25 20 20"/>
      </g>
    </symbol>

    <symbol id="ic-close" viewBox="0 0 24 24">
      <path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>

    <symbol id="ic-trash" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4.5 7h15M9.5 7V4.75h5V7M6.5 7l.9 12.25h9.2L17.5 7M10 10.5v5.5M14 10.5v5.5"/>
      </g>
    </symbol>

    <symbol id="ic-copy" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round">
        <rect x="8.5" y="8.5" width="11" height="11" rx="2.25"/>
        <path d="M15.5 8.5V6.75A2.25 2.25 0 0 0 13.25 4.5h-6.5A2.25 2.25 0 0 0 4.5 6.75v6.5a2.25 2.25 0 0 0 2.25 2.25H8.5"/>
      </g>
    </symbol>

    <symbol id="ic-check" viewBox="0 0 24 24">
      <path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <symbol id="ic-refresh" viewBox="0 0 24 24">
